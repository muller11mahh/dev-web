<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula três</title>
</head>
<body>
  
     <form action="#" method="post">

          <label for="nome">Nome:</label>
          <input type="text" id="nome" placeholder="seu nome.." required>
          <br><br>
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="seuemail@email.com">
          <br><br>
          <label for="senha">senha:</label>
          <input type="password" id="senha" required>
          <br><br>
          <label for="mensagem">mensagen:</label>
          <textarea name="mensagen" id="mensagem" rows="6" cols="80" placeholder="escreva aqui.."></textarea>
          <br><br>
          <label for="cidade">cidade:</label>
          <select name="cidade" id="cidade">
               <option value="">Selecione..</option>
               <option value="nh">Novo Hamburgo</option>
               <option value="sl">São Leopoldo</option>
               <option value="cb">Campo Bom</option>
               <option value="mgo">Montenegro</option>
          </select>
     </form>
</body>
</html>
