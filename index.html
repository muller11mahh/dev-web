<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula quatro</title>
</head>
<body>
  
<form action="#" method="post">

    <label for="nome">Nome:</label>
    <br><br>
    <input type="text" id="nome" placeholder="Seu nome completo">
    <br><br>
    <label for="email">E-mail:</label>
    <br><br>
    <input type="email" id="email" placeholder="seuemail@email.com">
    <br><br>
    <label for="senha">Senha (min 6, só letras e números):</label>
    <br><br>
    <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Mínimo 6 caracteres.." required>
    <br><br>
    <label for="idade">Idade (13 a 99):</label>
    <br><br>
    <input type="number" id="idade" min="13" max="99" required>
    <br><br>

    
</form>
    
</body>
</html>
