<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula quatro</title>
</head>
<body>
  
<h3>Tabela</h3>

    <table border="1">
     <tr>
          <th>Maria</th>
          <th>Arthur</th>
          <th>Vitória</th>
          <th>Apollo</th>
          <th>Miguel</th>
          <th>Pietra</th>
     </tr>
     <tr>
          <th>16 anos</th>
          <th>15 anos</th>
          <th>16 anos</th>
          <th>14 anos</th>
          <th>14 anos</th>
          <th>17 anos</th>
     </tr>
     <tr>
          <td>jogar vôlei</td>
          <td>jogar vôlei</td>
          <td>dançar</td>
          <td>jogar futebol</td>
          <td>Andar de cavalo</td>
          <td>Desenhar</td>
     </tr>
    </table>
    <br><br>
    <br><br>
<form action="#" method="post">

      <label for="nome">Nome:</label>
      <input type="text" id="nome" placeholder="seu nome.." required>
      <br><br>
      <label for="idade">Idade (15 a 100):</label>
      <input type="number" id="idade" min="15" max="100" required>
      <br><br>
      <label for="email">E-mail:</label>
      <input type="email" id="email" placeholder="seuemail@Email.com">
      <br><br>
      <label for="senha">Senha (min 6, Apenas letras e números):</label>
      <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Mínimo 6 caracteres.." required> 
      <br><br>
      <label for="cidade">Cidade:</label>
      <select name="cidade" id="cidade">
            <option value="">Selecione..</option>
            <option value="nh">Novo Hamburgo</option>
            <option value="poa">Porto Alegre</option>
            <option value="sl">São Leopoldo</option>
            <option value="sc">Santa Catarina</option>
      </select>
      <br><br>
      <fieldset>
          <legend>Gênero:</legend>
          <input type="rádio" id="masc" name="genero" value="M">
          <label for="masc">Masculino</label>
          <input type="rádio" id="fem" name="genero" value="F">
          <label for="fem">Feminino</label>
      </fieldset>


</form>

</body>
</html>
